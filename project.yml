name: Okusurhythm

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ja

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"

targets:
  Okusurhythm:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: Okusurhythm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).okusurhythm
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
    info:
      path: Okusurhythm/Info.plist
      properties:
        CFBundleDisplayName: おくすリズム
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ja
        UILaunchScreen: {}
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: お薬の写真を撮影して登録するために使います。
        REPO_URL: $(REPO_URL)
        PRIVACY_POLICY_URL: $(PRIVACY_POLICY_URL)

  OkusurhythmTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: OkusurhythmTests
    dependencies:
      - target: Okusurhythm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).okusurhythm.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Okusurhythm:
    build:
      targets:
        Okusurhythm: all
    run:
      config: Debug
    test:
      targets:
        - OkusurhythmTests
    archive:
      config: Release
